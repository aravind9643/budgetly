name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24        # runs the TypeScript tests natively (node --test)
          cache: npm
      - run: npm ci             # .npmrc sets legacy-peer-deps
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests (balances, alerts)
        run: npm test
      - name: Web build
        run: npx expo export --platform web
        env:
          # Placeholder values: the build only needs them to exist, nothing is called.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
